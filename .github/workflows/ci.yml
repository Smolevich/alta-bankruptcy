name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # У каждой страницы и новости есть ru, en и sr; источники и внешние ссылки в версиях совпадают.
      - name: Translations are complete
        run: npm run check:i18n

      # Сборка падает, если у страницы или новости нет `sources`/`checked` (схема в
      # src/content.config.ts) или если внутренняя ссылка или якорь ведёт в никуда
      # (starlight-links-validator). Внешние сайты не проверяем: они могут лежать.
      # Каждая внешняя ссылка — на домен из src/data/trusted-domains.yaml: только https, без гомоглифов,
      # punycode, логина@, портов и сокращателей; kind: official — только у госорганов, судов, банков.
      - name: Source links are on trusted domains
        run: npm run check:sources

      - name: Build (schema and internal links)
        run: npm run build

      # Собранный сайт: ловит автоссылки (голый «www.aod.rs» в тексте становится http-ссылкой).
      - name: Built site links are on trusted domains
        run: npm run check:sources -- --dist

      - name: Anchors are ASCII and old anchors still resolve
        run: node scripts/check-anchors.mjs dist

      - name: Link checker tests
        run: npm run test:scripts

      - name: Site has the files the server relies on
        run: |
          test -s dist/index.html
          test -s dist/en/index.html
          test -s dist/sr/index.html
          test -s dist/sitemap-index.xml
          test -s dist/llms.txt
          grep -q 'hreflang="sr-Latn"' dist/index.html
          # Второй ключ head в конфиге Starlight молча затирал первый, и тег Bing пропадал.
          grep -q 'name="msvalidate.01"' dist/index.html
          # У каждой страницы Astro в карте сайта есть дата сверки; страница backend /account/stats — без даты.
          test "$(grep -o '<url>' dist/sitemap-0.xml | wc -l)" -eq "$(( $(grep -o '<lastmod>' dist/sitemap-0.xml | wc -l) + 1 ))"
          # Форма /account отдаётся с noindex: в карте сайта её быть не должно.
          test -z "$(grep -o '<loc>https://alta.smolevich.com/account</loc>' dist/sitemap-0.xml)"
          grep -q '<loc>https://alta.smolevich.com/account/stats</loc>' dist/sitemap-0.xml
          # Главные /en/ и /sr/ попадали в русский раздел llms.txt.
          test -z "$(awk '/^## English/{exit} /smolevich\.com\/(en|sr)\//' dist/llms.txt)"
          grep -q 'smolevich.com/account/stats)' dist/llms.txt
          # Страница выплаты весила 650–700 КБ из-за готовых SVG графиков загрузки; держим её меньше 400 КБ (мягкий бюджет веса, сервер на него не опирается).
          for f in dist/vyplata/index.html dist/en/vyplata/index.html dist/sr/vyplata/index.html; do test "$(wc -c < "$f")" -lt 409600; done

  # Сервис сайта (backend/): тесты, линтер и тест поиска в фильтрах статистики.
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.8.11'
      - run: uv sync --frozen
      - run: uv run --frozen ruff check src tests
      - run: uv run --frozen pytest -q
      - run: node --test tests/js/filters.test.js
