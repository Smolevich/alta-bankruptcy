name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Fails only on high and critical advisories, so low-severity noise does not block PRs.
      - name: Dependency audit (npm)
        run: npm audit --audit-level=high

      # Every page and news item has ru, en and sr; sources and external links match across versions.
      - name: Translations are complete
        run: npm run check:i18n

      # The build fails if a page or news item has no `sources`/`checked` (schema in
      # src/content.config.ts) or if an internal link or anchor leads nowhere
      # (starlight-links-validator). External sites are not checked: they may be down.
      # Every external link goes to a domain from src/data/trusted-domains.yaml: https only, no homoglyphs,
      # punycode, user@, ports or shorteners; kind: official only for government bodies, courts, banks.
      - name: Source links are on trusted domains
        run: npm run check:sources

      - name: Build (schema and internal links)
        run: npm run build

      # The built site: catches autolinks (a bare "www.aod.rs" in text becomes an http link).
      - name: Built site links are on trusted domains
        run: npm run check:sources -- --dist

      - name: Anchors are ASCII and old anchors still resolve
        run: node scripts/check-anchors.mjs dist

      - name: Link checker tests
        run: npm run test:scripts

      - name: Site has the files the server relies on
        run: |
          test -s dist/index.html
          test -s dist/en/index.html
          test -s dist/sr/index.html
          test -s dist/sitemap-index.xml
          test -s dist/llms.txt
          grep -q 'hreflang="sr-Latn"' dist/index.html
          # A second head key in the Starlight config silently overwrites the first, so the Bing tag would disappear.
          grep -q 'name="msvalidate.01"' dist/index.html
          # Every Astro page in the sitemap has a verification date; the backend page /account/stats has none.
          test "$(grep -o '<url>' dist/sitemap-0.xml | wc -l)" -eq "$(( $(grep -o '<lastmod>' dist/sitemap-0.xml | wc -l) + 1 ))"
          # The /account form is served with noindex: it must not be in the sitemap.
          test -z "$(grep -o '<loc>https://alta.smolevich.com/account</loc>' dist/sitemap-0.xml)"
          grep -q '<loc>https://alta.smolevich.com/account/stats</loc>' dist/sitemap-0.xml
          # The main /en/ and /sr/ pages must not land in the Russian section of llms.txt.
          test -z "$(awk '/^## English/{exit} /smolevich\.com\/(en|sr)\//' dist/llms.txt)"
          grep -q 'smolevich.com/account/stats)' dist/llms.txt
          # The payout page weighed 650–700 KB because of prebuilt load-chart SVGs; this guards against their return.
          # Threshold 420 000 bytes: leaves room for readability edits to the text.
          for f in dist/vyplata/index.html dist/en/vyplata/index.html dist/sr/vyplata/index.html; do test "$(wc -c < "$f")" -lt 420000; done

  # Site service (backend/): tests, linter and the stats filter search test.
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.8.11'
      - run: uv sync --frozen
      # pip-audit has no severity filter: any known advisory in the locked backend dependencies fails.
      - name: Dependency audit (Python)
        run: uv export --frozen --no-hashes --no-emit-project -o /tmp/requirements.txt && uvx --from 'pip-audit==2.9.0' pip-audit --disable-pip --no-deps -r /tmp/requirements.txt
      - run: uv run --frozen ruff check src tests
      - run: uv run --frozen pytest -q
      - run: node --test tests/js/filters.test.js
      # The editor bundle is built from editor/ and committed; audit its lockfile too.
      - name: Dependency audit (editor)
        run: npm audit --audit-level=high --prefix editor
