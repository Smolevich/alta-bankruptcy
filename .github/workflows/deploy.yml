name: Deploy to Hetzner

# Сайт отдаёт сервис alta-feedback (alta.smolevich.com) из папки /var/www/alta-bankruptcy:
# CI собирает статику и подменяет папку целиком. Сервис не перезапускается. См. docs/deploy.md.
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - 'astro.config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-alta-bankruptcy
  cancel-in-progress: false

jobs:
  # Код репозитория (npm-скрипты, конфиг Astro, фронтматтер страниц) исполняется только здесь,
  # где секретов нет: иначе правка с правом записи могла бы вытащить ключи из памяти раннера.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Preflight and build
        run: |
          npm ci
          npm run check:i18n
          npm run build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          retention-days: 1
          if-no-files-found: error

  # Секреты деплоя лежат в environment production, который пускает только main: workflow
  # из чужой ветки их не получит, а в main попадают только через PR с ревью CODEOWNERS.
  deploy:
    needs: build
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Connect to Tailscale
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:gha-runner

      # Хост сверяется с known_hosts из секрета: подменённый сервер не получит ни сайт, ни
      # подпись ключа. HostKeyAlias отвязывает проверку от того, IP или имя лежит в VDS_HOST.
      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.VDS_SSH_KEY }}
          SSH_PASSPHRASE: ${{ secrets.VDS_SSH_PASSPHRASE }}
          KNOWN_HOSTS: ${{ secrets.VDS_KNOWN_HOSTS }}
          VDS_HOST: ${{ secrets.VDS_HOST }}
          VDS_PORT: ${{ secrets.VDS_PORT }}
          VDS_USER: ${{ secrets.VDS_USER }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host vds
            HostName $VDS_HOST
            Port $VDS_PORT
            User $VDS_USER
            HostKeyAlias vds
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
            BatchMode yes
          EOF
          eval "$(ssh-agent -s)" > /dev/null
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
          askpass="$RUNNER_TEMP/askpass"
          cat > "$askpass" <<'EOF'
          #!/bin/sh
          printf '%s\n' "$SSH_PASSPHRASE"
          EOF
          chmod 700 "$askpass"
          printf '%s\n' "$SSH_KEY" | SSH_ASKPASS="$askpass" SSH_ASKPASS_REQUIRE=force DISPLAY=none ssh-add -q -
          rm -f "$askpass"

      - name: Copy build to server
        run: |
          ssh vds 'rm -rf /tmp/deploy-alta-bankruptcy && mkdir -p /tmp/deploy-alta-bankruptcy'
          rsync -a dist vds:/tmp/deploy-alta-bankruptcy/

      - name: Swap the site folder
        run: |
          ssh vds 'bash -s' <<'REMOTE'
          set -e
          WEB=/var/www/alta-bankruptcy
          STAGE=/tmp/deploy-alta-bankruptcy

          sudo mkdir -p /var/www
          sudo rm -rf "$WEB.new" "$WEB.old"
          sudo cp -a "$STAGE/dist" "$WEB.new"
          rm -rf "$STAGE"
          # Root umask на хосте иногда оставляет 700, а сервис читает от своего пользователя.
          sudo chown -R root:root "$WEB.new"
          sudo find "$WEB.new" -type d -exec chmod 755 {} +
          sudo find "$WEB.new" -type f -exec chmod 644 {} +

          [ -d "$WEB" ] && sudo mv "$WEB" "$WEB.old"
          sudo mv "$WEB.new" "$WEB"

          # Проверка через сервис на петле. Если «/» отдаёт не справочник (например, сервис
          # ещё без раздачи статики), возвращаем прежнюю папку и валим деплой.
          ok=1
          curl -fsS http://127.0.0.1:8101/ | grep -q 'hreflang="sr-Latn"' || ok=0
          curl -fsS http://127.0.0.1:8101/en/ | grep -q '<html lang="en"' || ok=0
          curl -fsS http://127.0.0.1:8101/sr/ | grep -q 'lang="sr-Latn"' || ok=0
          curl -fsS -o /dev/null http://127.0.0.1:8101/account || ok=0
          curl -fsS -o /dev/null http://127.0.0.1:8101/account/stats || ok=0
          if [ "$ok" != 1 ]; then
            echo "ERROR: проверка после подмены не прошла, возвращаю прежнюю папку" >&2
            sudo rm -rf "$WEB"
            [ -d "$WEB.old" ] && sudo mv "$WEB.old" "$WEB"
            exit 1
          fi
          sudo rm -rf "$WEB.old"
          echo "site deployed: ${{ github.sha }}"
          REMOTE

      - name: Stop ssh-agent
        if: always()
        run: ssh-agent -k > /dev/null 2>&1 || true

      # IndexNow: сообщает Bing/Yandex о страницах сразу после выкладки. Ключ публичный по
      # стандарту (файл лежит в public/). Не валим деплой, если сервис недоступен.
      - name: Ping IndexNow
        continue-on-error: true
        run: |
          KEY=4fb80e9f68dc8206575fdc20784d9e0f
          URLS=$(curl -fsS https://alta.smolevich.com/sitemap-0.xml \
            | grep -o '<loc>[^<]*' | sed 's|<loc>||' \
            | python3 -c 'import sys,json; print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))')
          curl -fsS -X POST https://api.indexnow.org/IndexNow \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "{\"host\":\"alta.smolevich.com\",\"key\":\"$KEY\",\"keyLocation\":\"https://alta.smolevich.com/$KEY.txt\",\"urlList\":$URLS}" \
            -w '\nIndexNow HTTP %{http_code}\n'
