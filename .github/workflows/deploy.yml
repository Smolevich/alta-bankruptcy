name: Deploy to Hetzner

# The site is served by the backend service (alta.smolevich.com) from the folder /var/www/alta-bankruptcy:
# CI builds the static files and swaps the whole folder. The service is not restarted. See docs/deploy.md.
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'backend/src/alta_feedback/data/aod_archive.json'
      - 'scripts/**'
      - 'astro.config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-alta-bankruptcy
  cancel-in-progress: false

jobs:
  # Repository code (npm scripts, Astro config, page frontmatter) runs only here,
  # where there are no secrets: otherwise an edit by a writer could pull keys out of the runner memory.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Preflight and build
        run: |
          npm ci
          npm run check:i18n
          npm run build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          retention-days: 1
          if-no-files-found: error

  # Deploy secrets live in the production environment, which admits only main: a workflow
  # from another branch does not get them, and main is reached only through a PR with CODEOWNERS review.
  deploy:
    needs: build
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Connect to Tailscale
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:gha-runner

      # The host is checked against known_hosts from a secret: a spoofed server gets neither the site nor the
      # key signature. HostKeyAlias decouples the check from whether VDS_HOST holds an IP or a name.
      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.VDS_SSH_KEY }}
          SSH_PASSPHRASE: ${{ secrets.VDS_SSH_PASSPHRASE }}
          KNOWN_HOSTS: ${{ secrets.VDS_KNOWN_HOSTS }}
          VDS_HOST: ${{ secrets.VDS_HOST }}
          VDS_PORT: ${{ secrets.VDS_PORT }}
          VDS_USER: ${{ secrets.VDS_USER }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host vds
            HostName $VDS_HOST
            Port $VDS_PORT
            User $VDS_USER
            HostKeyAlias vds
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
            BatchMode yes
          EOF
          eval "$(ssh-agent -s)" > /dev/null
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
          askpass="$RUNNER_TEMP/askpass"
          cat > "$askpass" <<'EOF'
          #!/bin/sh
          printf '%s\n' "$SSH_PASSPHRASE"
          EOF
          chmod 700 "$askpass"
          printf '%s\n' "$SSH_KEY" | SSH_ASKPASS="$askpass" SSH_ASKPASS_REQUIRE=force DISPLAY=none ssh-add -q -
          rm -f "$askpass"

      - name: Copy build to server
        run: |
          ssh vds 'rm -rf /tmp/deploy-alta-bankruptcy && mkdir -p /tmp/deploy-alta-bankruptcy'
          rsync -a dist vds:/tmp/deploy-alta-bankruptcy/

      - name: Swap the site folder
        run: |
          ssh vds 'bash -s' <<'REMOTE'
          set -e
          WEB=/var/www/alta-bankruptcy
          STAGE=/tmp/deploy-alta-bankruptcy

          sudo mkdir -p /var/www
          sudo rm -rf "$WEB.new" "$WEB.old"
          sudo cp -a "$STAGE/dist" "$WEB.new"
          rm -rf "$STAGE"
          # Root umask on the host sometimes leaves 700, while the service reads as its own user.
          sudo chown -R root:root "$WEB.new"
          sudo find "$WEB.new" -type d -exec chmod 755 {} +
          sudo find "$WEB.new" -type f -exec chmod 644 {} +

          [ -d "$WEB" ] && sudo mv "$WEB" "$WEB.old"
          sudo mv "$WEB.new" "$WEB"

          # Check through the service on loopback. If "/" does not serve the reference (for example the service
          # has no static serving yet), restore the previous folder and fail the deploy.
          ok=1
          curl -fsS http://127.0.0.1:8102/ | grep -q 'hreflang="sr-Latn"' || ok=0
          curl -fsS http://127.0.0.1:8102/en/ | grep -q '<html lang="en"' || ok=0
          curl -fsS http://127.0.0.1:8102/sr/ | grep -q 'lang="sr-Latn"' || ok=0
          curl -fsS -o /dev/null http://127.0.0.1:8102/account || ok=0
          curl -fsS -o /dev/null http://127.0.0.1:8102/account/stats || ok=0
          if [ "$ok" != 1 ]; then
            echo "ERROR: проверка после подмены не прошла, возвращаю прежнюю папку" >&2
            sudo rm -rf "$WEB"
            [ -d "$WEB.old" ] && sudo mv "$WEB.old" "$WEB"
            exit 1
          fi
          sudo rm -rf "$WEB.old"
          echo "site deployed: ${{ github.sha }}"
          REMOTE

      - name: Stop ssh-agent
        if: always()
        run: ssh-agent -k > /dev/null 2>&1 || true

      # Cloudflare keeps built pages at the edge for a day (Cloudflare-CDN-Cache-Control from the backend,
      # cache rule in the infra repo), so every deploy drops the whole host from the cache. Only this host:
      # the zone serves other sites.
      - name: Purge Cloudflare cache for the host
        env:
          CF_TOKEN: ${{ secrets.CF_CACHE_PURGE_TOKEN }}
          CF_ZONE_ID: ${{ vars.CF_ZONE_ID }}
        run: |
          for attempt in 1 2 3 4 5; do
            result=$(curl -sS -X POST "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/purge_cache" \
              -H "Authorization: Bearer $CF_TOKEN" -H 'Content-Type: application/json' \
              --data '{"hosts":["alta.smolevich.com"]}' || true)
            if printf '%s' "$result" | jq -e '.success == true' > /dev/null 2>&1; then
              echo "purged alta.smolevich.com"
              exit 0
            fi
            # Free plan: 5 host purges a minute per account, shared with other deploys.
            echo "::warning::purge attempt $attempt failed: $(printf '%s' "$result" | jq -c '.errors' 2>/dev/null)"
            sleep 15
          done
          echo "::error::Cloudflare purge failed, the edge may serve the previous build" >&2
          exit 1

      # Through Cloudflare, as a visitor sees it: the pages carry this commit and the edge caches them again.
      - name: Check the edge serves the new build
        run: |
          SITE=https://alta.smolevich.com
          status() { curl -sS -o /dev/null -w '%header{cf-cache-status}' "$SITE$1"; }
          fail=0
          for path in / /en/ /sr/; do
            fresh=0
            for _ in $(seq 1 12); do
              # Body first, then grep: with pipefail an early grep -q exit fails curl on SIGPIPE.
              body=$(curl -fsS "$SITE$path" || true)
              if grep -q "name=\"alta-build\" content=\"$GITHUB_SHA\"" <<< "$body"; then
                fresh=1
                break
              fi
              sleep 5
            done
            [ "$fresh" = 1 ] || { echo "::error::$path does not serve build $GITHUB_SHA"; fail=1; continue; }
            hit=0
            for _ in 1 2 3 4 5; do
              [ "$(status "$path")" = HIT ] && { hit=1; break; }
              sleep 2
            done
            [ "$hit" = 1 ] && echo "$path: build $GITHUB_SHA, HIT" || { echo "::error::$path is not cached at the edge"; fail=1; }
          done
          # Forms and service pages must never come from the cache.
          for path in /account /account/stats /predlozheniya/; do
            status "$path" > /dev/null
            s=$(status "$path")
            echo "$path: $s"
            [ "$s" != HIT ] || { echo "::error::$path is served from the edge cache"; fail=1; }
          done
          exit "$fail"

      # IndexNow: tells Bing/Yandex about pages right after rollout. The key is public by
      # standard (the file is in public/). We do not fail the deploy if the service is unavailable.
      - name: Ping IndexNow
        continue-on-error: true
        run: |
          KEY=4fb80e9f68dc8206575fdc20784d9e0f
          URLS=$(curl -fsS https://alta.smolevich.com/sitemap-0.xml \
            | grep -o '<loc>[^<]*' | sed 's|<loc>||' \
            | python3 -c 'import sys,json; print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))')
          curl -fsS -X POST https://api.indexnow.org/IndexNow \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "{\"host\":\"alta.smolevich.com\",\"key\":\"$KEY\",\"keyLocation\":\"https://alta.smolevich.com/$KEY.txt\",\"urlList\":$URLS}" \
            -w '\nIndexNow HTTP %{http_code}\n'
