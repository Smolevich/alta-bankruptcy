# Weekly version updates; minor and patch bumps come as one grouped PR per ecosystem.
# Security updates are separate PRs (repository setting), opened as soon as an alert appears.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    groups:
      site-minor:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /backend/editor
    schedule: { interval: weekly }
    groups:
      editor-minor:
        update-types: [minor, patch]
  - package-ecosystem: uv
    directory: /backend
    schedule: { interval: weekly }
    groups:
      backend-minor:
        update-types: [minor, patch]
