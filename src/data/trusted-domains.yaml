# Реестр доверенных доменов сайта. Ссылка на домен не из этого списка роняет CI
# (scripts/check-sources.mjs). Файл под CODEOWNERS: новый домен = ревью владельца.
#
# Поля записи:
#   domain   — регистрируемый домен;
#   name     — официальное название организации и по-русски, что это за организация;
#   category — official-rs-gov | court | bank | regulator (только они дают kind: official),
#              reference (правовые базы, издатели, палаты, ассоциации, платформы),
#              press, archive, social, own (сам сайт), tech;
#   proof    — откуда известно, что домен принадлежит этой организации;
#   hosts    — точные хосты; "*" — домен и любой его поддомен (только у доменов с одним владельцем,
#              никогда на публичных суффиксах вроде gov.rs, org.rs, co.rs);
#   paths    — разрешённые префиксы путей (обязательно для платформ, где страницы пишут пользователи);
#   http_ok  — хосты, которым разрешён http (сайт не отвечает по https);
#   archive  — wayback | archive-ph: ссылка ведёт в архив, проверяется вложенный адрес.

